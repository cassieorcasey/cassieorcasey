<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Cassandra Su. Building toward Lead Data Scientist. Now: Foundations. Next: Data Scientist. Later: Lead Data Scientist.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfd"/><stop offset="1" stop-color="#f2f2f7"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="sh" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <clipPath id="r"><rect width="1200" height="300" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity="0.30">
      <circle cx="1010" cy="40" r="120" fill="#0a84ff"/>
      <circle cx="1130" cy="280" r="130" fill="#bf5af2"/>
      <circle cx="760" cy="300" r="100" fill="#64d2ff"/>
    </g>
  </g>
  <text x="72" y="108" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="1.6" fill="#0071e3">DATA SCIENCE  ·  PYTHON  ·  MATH</text>
  <text x="70" y="178" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="70" font-weight="700" letter-spacing="-2.4" fill="#1d1d1f">Cassandra Su</text>
  <text x="72" y="224" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="400" letter-spacing="-0.3" fill="#6e6e73">Building toward Lead Data Scientist.</text>
  <g filter="url(#sh)">
    <rect x="740" y="40" width="340" height="72" rx="20" fill="#ffffff" fill-opacity="0.72" stroke="#000000" stroke-opacity="0.08"/>
  </g>
  <circle cx="774" cy="76" r="8" fill="#0071e3"/>
  <text x="800" y="69" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.4" fill="#6e6e73">NOW</text>
  <text x="800" y="94" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.4" fill="#1d1d1f">Foundations</text>
  <g filter="url(#sh)">
    <rect x="764" y="118" width="340" height="72" rx="20" fill="#ffffff" fill-opacity="0.72" stroke="#000000" stroke-opacity="0.08"/>
  </g>
  <circle cx="798" cy="154" r="7" fill="none" stroke="#0071e3" stroke-width="2"/>
  <text x="824" y="147" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.4" fill="#6e6e73">NEXT</text>
  <text x="824" y="172" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.4" fill="#1d1d1f">Data Scientist</text>
  <g filter="url(#sh)">
    <rect x="788" y="196" width="340" height="72" rx="20" fill="#ffffff" fill-opacity="0.72" stroke="#000000" stroke-opacity="0.08"/>
  </g>
  <circle cx="822" cy="232" r="7" fill="none" stroke="#0071e3" stroke-width="2"/>
  <text x="848" y="225" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.4" fill="#6e6e73">LATER</text>
  <text x="848" y="250" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.4" fill="#1d1d1f">Lead Data Scientist</text>
</svg>
